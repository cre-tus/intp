# ===== MySQL =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

server.port=8080
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB
google.maps.browser-api-key=${GOOGLE_MAP_API:${GOOGLE_BROWSER_API_KEY:${GOOGLE_MAPS_API_KEY:}}}
google.maps.server-api-key=${GOOGLE_PRIVATE_API:${GOOGLE_SERVER_API_KEY:${GOOGLE_CLOUD_API_KEY:}}}
gtfs.dataset-dirs=${GTFS_DATASET_DIRS:db/gtfs/korea_national,db/gtfs/tokyo_rail}
gtfs.load-route-names=${GTFS_LOAD_ROUTE_NAMES:false}
place.photon.enabled=${PHOTON_ENABLED:false}
place.photon.base-url=${PHOTON_BASE_URL:http://127.0.0.1:2322}
place.translation.enabled=${PLACE_TRANSLATION_ENABLED:true}
place.translation.base-url=${PLACE_TRANSLATION_BASE_URL:http://127.0.0.1:5000}
ml.ingest.base-url=${ML_INGEST_BASE_URL:http://127.0.0.1:8092}
